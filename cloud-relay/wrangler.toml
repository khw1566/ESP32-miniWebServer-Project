name = "mini-web-relay"
account_id = "60bbc5ec2b671498c5f12537cd46e65a"
main = "worker.mjs"
compatibility_date = "2026-10-06"
workers_dev = false

[vars]
PUBLIC_DOMAIN = "audreaming.com"
# Set to the provisioned board ID, e.g. m1-aabbccddeeff, before deployment.
DEMO_DEVICE = "m1-b0cbd899de80"

# Demo: relay endpoint plus one board hostname. Add a board route at provisioning.
[[routes]]
pattern = "relay.audreaming.com"
custom_domain = true

[[routes]]
pattern = "demo.audreaming.com"
custom_domain = true

[[routes]]
pattern = "audreaming.com"
custom_domain = true

[[routes]]
pattern = "m1-b0cbd899de80.audreaming.com"
custom_domain = true

[[routes]]
pattern = "m1-20500d34b5f0.audreaming.com"
custom_domain = true

[[routes]]
pattern = "m3-80f1b2d68499.audreaming.com"
custom_domain = true

[[routes]]
pattern = "c3-90da728a2b18.audreaming.com"
custom_domain = true

[[durable_objects.bindings]]
name = "DEVICES"
class_name = "RelayDevice"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDevice"]

# v2 added a name directory (RelayDirectory) that was rolled back on 2026-10-07.
# Keep both entries: deployed migrations must stay in order.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["RelayDirectory"]

[[migrations]]
tag = "v3"
deleted_classes = ["RelayDirectory"]
