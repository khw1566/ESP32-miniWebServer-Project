<main><span class="tag">Mini WEB M1</span><h1>전원과 Wi-Fi만으로<br>내 웹서비스를 시작합니다.</h1>
<p>이 페이지는 M1 보드에 저장되어 있습니다. 보드가 클라우드에 직접 연결해 외부 방문자에게 웹페이지를 전달합니다.</p>
<p>집에 별도 PC를 켜두거나 공유기의 포트를 설정할 필요가 없습니다.</p>
<p>대회 시연: 휴대폰 Wi-Fi를 끄고 모바일 데이터로 접속한 뒤, 보드를 껐다 켜서 같은 주소로 복구되는지 확인하세요.</p></main>
