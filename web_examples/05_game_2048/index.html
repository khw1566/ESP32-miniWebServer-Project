<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2048 퍼즐 - ESP32 미니게임</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: none; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; -webkit-user-select: none; user-select: none; }
    .game-container { width: 100%; max-width: 360px; }
    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .title-box h1 { font-size: 32px; font-weight: 800; color: #38bdf8; line-height: 1; letter-spacing: -1px; }
    .title-box p { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .scores { display: flex; gap: 8px; }
    .score-box { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 6px 14px; text-align: center; min-width: 70px; }
    .score-label { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
    .score-val { font-size: 16px; font-weight: 800; color: #f8fafc; }
    .controls-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn-new { background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(2,132,199,0.3); }
    .btn-new:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(2,132,199,0.5); }
    .btn-nav { color: #38bdf8; text-decoration: none; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .board-wrap { position: relative; background: #1e293b; border: 2px solid #334155; border-radius: 16px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; width: 100%; aspect-ratio: 1; }
    .cell { background: rgba(15, 23, 42, 0.7); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: 800; transition: all 0.15s ease-in-out; position: relative; }
    .cell.val-2 { background: #334155; color: #f8fafc; }
    .cell.val-4 { background: #475569; color: #f8fafc; }
    .cell.val-8 { background: #d97706; color: #fff; box-shadow: 0 0 12px rgba(217, 119, 6, 0.4); }
    .cell.val-16 { background: #ea580c; color: #fff; box-shadow: 0 0 14px rgba(234, 88, 12, 0.4); }
    .cell.val-32 { background: #dc2626; color: #fff; box-shadow: 0 0 16px rgba(220, 38, 38, 0.5); }
    .cell.val-64 { background: #db2777; color: #fff; box-shadow: 0 0 18px rgba(219, 39, 119, 0.5); }
    .cell.val-128 { background: #7c3aed; color: #fff; font-size: 20px; box-shadow: 0 0 20px rgba(124, 58, 237, 0.6); }
    .cell.val-256 { background: #2563eb; color: #fff; font-size: 20px; box-shadow: 0 0 22px rgba(37, 99, 235, 0.6); }
    .cell.val-512 { background: #0284c7; color: #fff; font-size: 20px; box-shadow: 0 0 24px rgba(2, 132, 199, 0.7); }
    .cell.val-1024 { background: #059669; color: #fff; font-size: 16px; box-shadow: 0 0 26px rgba(5, 150, 105, 0.8); }
    .cell.val-2048 { background: linear-gradient(135deg, #eab308, #ca8a04); color: #000; font-size: 16px; box-shadow: 0 0 30px rgba(234, 179, 8, 0.9); animation: pulse2048 1.5s infinite; }
    @keyframes pulse2048 { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .cell.anim-new { animation: popNew 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popNew { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .overlay-msg { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(4px); border-radius: 16px; display: none; flex-direction: column; justify-content: center; align-items: center; gap: 12px; z-index: 10; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .overlay-msg h2 { font-size: 26px; font-weight: 800; color: #f8fafc; }
    .overlay-msg p { font-size: 13px; color: #94a3b8; }
    .guide-tip { margin-top: 14px; text-align: center; font-size: 12px; color: #64748b; }
    .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 150px; margin: 16px auto 0; }
    .dpad-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.15s; }
    .dpad-btn:active { background: #0284c7; color: #fff; border-color: #0284c7; transform: scale(0.95); }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="game-header">
      <div class="title-box">
        <h1>2048</h1>
        <p>Pure JS / ESP32 온보드 실행</p>
      </div>
      <div class="scores">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-val" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">Best</div>
          <div class="score-val" id="best">0</div>
        </div>
      </div>
    </div>

    <div class="controls-top">
      <a href="/" class="btn-nav">← 메인 허브</a>
      <button class="btn-new" onclick="initGame()">새 게임</button>
    </div>

    <div class="board-wrap" id="boardWrap">
      <div class="grid" id="grid"></div>
      <div class="overlay-msg" id="overlay">
        <h2 id="overlayTitle">게임 종료!</h2>
        <p id="overlaySub">더 이상 이동할 수 없습니다.</p>
        <button class="btn-new" onclick="initGame()">다시 도전</button>
      </div>
    </div>

    <!-- 모바일 터치 패드 -->
    <div class="dpad">
      <div></div>
      <button class="dpad-btn" onclick="move('up')">▲</button>
      <div></div>
      <button class="dpad-btn" onclick="move('left')">◀</button>
      <button class="dpad-btn" onclick="move('down')">▼</button>
      <button class="dpad-btn" onclick="move('right')">▶</button>
    </div>

    <div class="guide-tip">
      화면을 스와이프하거나 키보드 방향키 / D-PAD를 누르세요.
    </div>
  </div>

  <script>
    const SIZE = 4;
    let board = [];
    let score = 0;
    let best = localStorage.getItem('2048_best') || 0;
    document.getElementById('best').textContent = best;

    function initGame() {
      board = Array(SIZE).fill(0).map(() => Array(SIZE).fill(0));
      score = 0;
      updateScore(0);
      document.getElementById('overlay').style.display = 'none';
      spawnTile();
      spawnTile();
      render();
    }

    function spawnTile() {
      let empty = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length > 0) {
        let spot = empty[Math.floor(Math.random() * empty.length)];
        board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
        return spot;
      }
      return null;
    }

    function render(newSpot) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const val = board[r][c];
          const cell = document.createElement('div');
          cell.className = 'cell' + (val > 0 ? ' val-' + val : '');
          if (newSpot && newSpot.r === r && newSpot.c === c) {
            cell.classList.add('anim-new');
          }
          cell.textContent = val > 0 ? val : '';
          grid.appendChild(cell);
        }
      }
    }

    function updateScore(add) {
      score += add;
      document.getElementById('score').textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('2048_best', best);
        document.getElementById('best').textContent = best;
      }
    }

    function slide(row) {
      let arr = row.filter(v => v !== 0);
      let added = 0;
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          added += arr[i];
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(v => v !== 0);
      while (arr.length < SIZE) arr.push(0);
      return { row: arr, score: added };
    }

    function move(dir) {
      let rotated = 0;
      if (dir === 'up') rotated = 1;
      else if (dir === 'right') rotated = 2;
      else if (dir === 'down') rotated = 3;

      for (let i = 0; i < rotated; i++) board = rotateLeft(board);

      let changed = false;
      let totalAdd = 0;
      for (let r = 0; r < SIZE; r++) {
        let res = slide(board[r]);
        if (res.row.some((val, idx) => val !== board[r][idx])) changed = true;
        board[r] = res.row;
        totalAdd += res.score;
      }

      for (let i = 0; i < (4 - rotated) % 4; i++) board = rotateLeft(board);

      if (changed) {
        updateScore(totalAdd);
        let newSpot = spawnTile();
        render(newSpot);
        if (checkGameOver()) {
          document.getElementById('overlay').style.display = 'flex';
        }
      }
    }

    function rotateLeft(mat) {
      return mat[0].map((_, c) => mat.map(row => row[SIZE - 1 - c]));
    }

    function checkGameOver() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) return false;
          if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return false;
          if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return false;
        }
      }
      return true;
    }

    // 키보드 리스너
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') { move('up'); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { move('down'); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { move('left'); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { move('right'); e.preventDefault(); }
    });

    // 터치 스와이프 리스너
    let touchStartX = 0, touchStartY = 0;
    const wrap = document.getElementById('boardWrap');
    wrap.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: false });

    wrap.addEventListener('touchend', (e) => {
      let dx = e.changedTouches[0].screenX - touchStartX;
      let dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
        if (Math.abs(dx) > Math.abs(dy)) {
          move(dx > 0 ? 'right' : 'left');
        } else {
          move(dy > 0 ? 'down' : 'up');
        }
      }
    }, { passive: false });

    initGame();
  </script>
</body>
</html>
